services:
    traefik:
        image: "traefik:latest"
        container_name: "dev_dummy_traefik"
        command:
          - "--api.insecure=true"
          - "--providers.docker=true"
          - "--providers.docker.exposedbydefault=false"
          - "--entrypoints.web.address=:80"
        ports:
          - "80:80"
          - "8080:8080"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
    db:
        build:
            context: ./database
            dockerfile: Dockerfile
        container_name: "dev_dummy_db"
        environment:
            MYSQL_DATABASE: 'booksys'
            MYSQL_USER: 'user'
            MYSQL_PASSWORD: 'userpassword'
            MYSQL_ROOT_PASSWORD: 'rootpassword'
        ports:
            - '3306:3306'
        expose:
            - '3306'
    api_v2:
        build:
            context: ../../backend
            dockerfile: Dockerfile
        container_name: dev_dummy_backend_api_v2
        depends_on:
            - db
        volumes:
            # The database credentials and the rest of the startup
            # configuration come from this file, the backend picks it up as
            # ./config.yaml relative to its working directory (/).
            - ./config.yaml:/config.yaml
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.api_v2.entrypoints=web"
            - "traefik.http.routers.api_v2.rule=PathPrefix(`/api/v2`) || PathPrefix(`/uploads`)"
            - "traefik.http.services.api_v2.loadbalancer.server.port=9090"
    frontend:
        # We use a development instance and not the
        # real container.
        build: "./frontend"
        container_name: "dev_dummy_frontend"
        depends_on:
            - db
            - api_v2
        user: "node"
        working_dir: /home/node/app
        environment:
            - NODE_ENV=development
        volumes:
            - ../../frontend:/home/node/app
            # node_modules of the host are built for the host platform, use a
            # separate volume with the packages for this container instead
            - frontend_node_modules:/home/node/app/node_modules
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frontend.entrypoints=web"
            - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
            - "traefik.http.services.frontend.loadbalancer.server.port=8080"
        # serve-port binds vite to 0.0.0.0:8080, the plain `serve` script only
        # listens on localhost and would not be reachable from traefik.
        command: "sh -c 'npm install && npm run serve-port'"

volumes:
    frontend_node_modules:
