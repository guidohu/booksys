port: 9090
database:
  protocol: tcp
  host: db
  port: 3306
  user: user
  password: userpassword
  dbName: booksys
http:
  # This stack is served over plain HTTP, where a browser would discard a
  # cookie that carries the `Secure` attribute.
  secureCookie: false
  sessionInactivityTimeout: 604800
  sessionTimeout: 31536000
  # The api_v2 image creates this directory for the booksys user, uploaded
  # logos are stored and served from here.
  uploadPath: /var/lib/booksys/uploads
